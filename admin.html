<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeWave Capital | Admin Panel</title>
<style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
    body {background:linear-gradient(145deg,#f8faff 0%,#f0f5fe 100%); min-height:100vh; padding:2rem;}
    .container {max-width:1600px; margin:0 auto;}
    .header {background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-radius:24px; padding:1.5rem 2rem; margin-bottom:2rem; display:flex; justify-content:space-between; align-items:center; box-shadow:0 20px 40px rgba(0,20,60,0.08); border:1px solid rgba(255,255,255,0.5);}
    .header h1 {color:#1e2f4f; font-size:2rem;}
    .logout-btn {background:#fee2e2; color:#dc2626; padding:0.6rem 1.5rem; border-radius:40px; text-decoration:none; font-weight:500; border:1px solid #fecaca; transition:0.3s;}
    .logout-btn:hover {background:#dc2626; color:white;}
    .stats-grid {display:grid; grid-template-columns:repeat(4,1fr); gap:1.5rem; margin-bottom:2rem;}
    .stat-card {background:white; border-radius:20px; padding:1.8rem; box-shadow:0 15px 30px rgba(0,20,40,0.06); border:1px solid rgba(230,240,255,0.8);}
    .stat-label {color:#5f7d9c; font-size:0.9rem; text-transform:uppercase; margin-bottom:0.5rem;}
    .stat-number {color:#1e2f4f; font-size:2.5rem; font-weight:700; line-height:1.2; margin-bottom:0.3rem;}
    .stat-trend {color:#28a745; font-size:0.95rem;}
    .control-grid {display:grid; grid-template-columns:1.2fr 0.8fr; gap:1.5rem; margin-bottom:2rem;}
    .card {background:white; border-radius:24px; padding:2rem; border:1px solid rgba(230,240,255,0.8);}
    .card-header {display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;}
    .card-header h3 {color:#1e2f4f; font-size:1.3rem;}
    .badge {background:#eef3fc; padding:0.3rem 1rem; border-radius:40px; color:#1e2f4f; font-size:0.8rem;}
    .form-group {margin-bottom:1rem;}
    .form-group label {display:block; color:#5f7d9c; font-size:0.85rem; margin-bottom:0.3rem;}
    .form-group input {width:100%; padding:0.8rem 1rem; border:2px solid #eef3fc; border-radius:12px; font-size:0.95rem; outline:none;}
    .form-group input:focus {border-color:#1e2f4f;}
    .add-btn {width:100%; padding:1rem; background:#1e2f4f; color:white; border:none; border-radius:12px; font-weight:600; font-size:1rem; cursor:pointer; margin-top:0.5rem;}
    .add-btn:hover {background:#2d4373;}
    .investor-table {width:100%; border-collapse:collapse;}
    .investor-table th, .investor-table td {padding:1rem; text-align:left; border-bottom:1px solid #f0f5fd;}
    .investor-table th {color:#5f7d9c; font-weight:500; font-size:0.85rem;}
    .profit {color:#28a745; font-weight:600;}
    .edit-input {width:100px; padding:0.3rem; border:1px solid #cbd5e1; border-radius:6px;}
    .action-btn {padding:0.3rem 0.8rem; border-radius:20px; font-size:0.75rem; cursor:pointer; background:#eef3fc; color:#1e2f4f; border:1px solid #d9e4f0; margin-right:0.3rem;}
    .action-btn:hover {background:#1e2f4f; color:white;}
    .footer {text-align:center; color:#5f7d9c; font-size:0.9rem; margin-top:2rem;}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔐 Admin Panel</h1>
        <a href="#" class="logout-btn">Logout</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Investors</div><div class="stat-number" id="totalInvestors">0</div></div>
        <div class="stat-card"><div class="stat-label">Total AUM</div><div class="stat-number" id="totalAUM">R0</div></div>
        <div class="stat-card"><div class="stat-label">Pending Withdrawals</div><div class="stat-number" id="pendingAmount">R0</div></div>
        <div class="stat-card"><div class="stat-label">Avg. Return</div><div class="stat-number" id="avgReturn">0%</div></div>
    </div>

    <!-- Control Grid -->
    <div class="control-grid">
        <!-- Add/Edit Investor -->
        <div class="card">
            <div class="card-header">
                <h3>➕ Add New Investor</h3>
                <span class="badge">Manual Entry</span>
            </div>
            <div class="form-group"><label>Full Name</label><input type="text" id="newName" placeholder="John Dube"></div>
            <div class="form-group"><label>Email</label><input type="email" id="newEmail" placeholder="john@example.com"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="newPhone" placeholder="0821234567"></div>
            <div class="form-group"><label>Initial Investment</label><input type="number" id="newInvestment" placeholder="50000"></div>
            <button class="add-btn" onclick="addNewInvestor()">Add Investor →</button>
        </div>

        <!-- Pending Withdrawals -->
        <div class="card">
            <div class="card-header">
                <h3>⏳ Pending Withdrawals</h3>
                <span class="badge" id="pendingBadge">0 waiting</span>
            </div>
            <div id="pendingList"></div>
        </div>
    </div>

    <!-- Investors Table -->
    <div class="card">
        <div class="card-header"><h3>📋 All Investors</h3></div>
        <input type="text" id="searchInput" placeholder="Search by name or ID..." onkeyup="searchInvestors()" style="width:100%; padding:0.7rem; margin-bottom:1rem; border-radius:12px; border:1px solid #eef3fc;">
        <table class="investor-table" id="investorTable">
            <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Initial</th><th>Current</th><th>Profit</th><th>Actions</th></tr>
            </thead>
            <tbody id="investorTableBody"></tbody>
        </table>
    </div>

    <div class="footer">PrimeWave Capital © 2025 | 📍 Durban, South Africa | 📞 +27 62 550 3303</div>
</div>

<script>
let investors = [
    { id:'INV001', name:'Thabo M.', email:'thabo.m@example.com', phone:'0821234567', initial:125000, current:142800 },
    { id:'INV002', name:'Nomsa K.', email:'nomsa.k@example.com', phone:'0837654321', initial:250000, current:289500 },
    { id:'INV003', name:'David R.', email:'david.r@example.com', phone:'0849988776', initial:50000, current:61200 }
];

let pendingWithdrawals = [
    { id:'WD001', investorId:'INV003', name:'David R.', amount:22000, date:'2025-02-27', reason:'Education fees' }
];

function loadInvestors(){
    const tbody=document.getElementById('investorTableBody'); tbody.innerHTML='';
    investors.forEach(inv=>{
        let profit=inv.current-inv.initial;
        let profitClass=profit>=0?'profit':'';
        let row=`<tr>
            <td>${inv.id}</td>
            <td>${inv.name}</td>
            <td>${inv.email}</td>
            <td>${inv.phone}</td>
            <td>R${inv.initial.toLocaleString()}</td>
            <td><span id="current-${inv.id}">R${inv.current.toLocaleString()}</span>
                <input type="number" id="update-${inv.id}" class="edit-input" style="display:none;" value="${inv.current}"></td>
            <td class="${profitClass}">${profit>=0?'+R'+profit.toLocaleString():'-R'+Math.abs(profit).toLocaleString()}</td>
            <td>
                <button class="action-btn" onclick="editBalance('${inv.id}')" id="edit-${inv.id}">Edit</button>
                <button class="action-btn" onclick="saveBalance('${inv.id}')" id="save-${inv.id}" style="display:none;">Save</button>
                <button class="action-btn" onclick="cancelEdit('${inv.id}')" id="cancel-${inv.id}" style="display:none;">Cancel</button>
                <button class="action-btn" onclick="removeInvestor('${inv.id}')">Remove</button>
            </td>
        </tr>`;
        tbody.innerHTML+=row;
    });
    updateStats();
}

function updateStats(){
    let total=investors.length;
    let totalAUM=investors.reduce((sum,i)=>sum+i.current,0);
    document.getElementById('totalInvestors').innerText=total;
    document.getElementById('totalAUM').innerText='R'+(totalAUM/1000000).toFixed(2)+'M';
    document.getElementById('pendingAmount').innerText='R'+pendingWithdrawals.reduce((sum,w)=>sum+w.amount,0).toLocaleString();
    document.getElementById('avgReturn').innerText=((investors.reduce((sum,i)=>sum+(i.current-i.initial)/i.initial,0)/total)*100).toFixed(1)+'%';
    document.getElementById('pendingBadge').innerText=pendingWithdrawals.length+' waiting';
    loadPendingWithdrawals();
}

function addNewInvestor(){
    const name=document.getElementById('newName').value;
    const email=document.getElementById('newEmail').value;
    const phone=document.getElementById('newPhone').value;
    const initial=parseFloat(document.getElementById('newInvestment').value);
    if(!name||!email||!phone||!initial){alert('Please fill all fields'); return;}
    const newId='INV'+String(investors.length+1).padStart(3,'0');
    investors.push({id:newId,name,email,phone,initial,current:initial});
    document.getElementById('newName').value=''; document.getElementById('newEmail').value=''; document.getElementById('newPhone').value=''; document.getElementById('newInvestment').value='';
    loadInvestors();
}

function editBalance(id){
    document.getElementById(`current-${id}`).style.display='none';
    document.getElementById(`update-${id}`).style.display='inline-block';
    document.getElementById(`edit-${id}`).style.display='none';
    document.getElementById(`save-${id}`).style.display='inline-block';
    document.getElementById(`cancel-${id}`).style.display='inline-block';
}

function saveBalance(id){
    const val=parseFloat(document.getElementById(`update-${id}`).value);
    const inv=investors.find(i=>i.id===id);
    if(inv){inv.current=val; loadInvestors();}
}

function cancelEdit(id){
    document.getElementById(`current-${id}`).style.display='inline-block';
    document.getElementById(`update-${id}`).style.display='none';
    document.getElementById(`edit-${id}`).style.display='inline-block';
    document.getElementById(`save-${id}`).style.display='none';
    document.getElementById(`cancel-${id}`).style.display='none';
}

function removeInvestor(id){
    if(confirm('Are you sure you want to remove this investor?')){
        investors=investors.filter(i=>i.id!==id);
        loadInvestors();
    }
}

function loadPendingWithdrawals(){
    const list=document.getElementById('pendingList'); list.innerHTML='';
    pendingWithdrawals.forEach(w=>{
        list.innerHTML+=`<div style="padding:1rem;border-bottom:1px solid #eef3fc;">
            <strong>${w.name}</strong> - R${w.amount.toLocaleString()} (${w.reason})
            <div style="margin-top:0.5rem;">
                <button onclick="approve('${w.id}')">Approve</button>
                <button onclick="decline('${w.id}')">Decline</button>
            </div>
        </div>`;
    });
}

function approve(id){
    const wd=pendingWithdrawals.find(w=>w.id===id);
    const inv=investors.find(i=>i.id===wd.investorId);
    if(inv){inv.current-=wd.amount;}
    pendingWithdrawals=pendingWithdrawals.filter(w=>w.id!==id);
    loadInvestors();
}

function decline(id){
    pendingWithdrawals=pendingWithdrawals.filter(w=>w.id!==id);
    loadInvestors();
}

function searchInvestors(){
    const search=document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#investorTable tbody tr').forEach(tr=>{
        tr.style.display=tr.textContent.toLowerCase().includes(search)?'':'none';
    });
}

loadInvestors();
</script>
</body>
    </html>
