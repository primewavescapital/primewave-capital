<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeWave Capital | Investor Portal</title>
<style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
    body {background:linear-gradient(145deg,#f8faff 0%,#f0f5fe 100%); min-height:100vh; padding:2rem;}
    .container {max-width:900px; margin:0 auto;}
    .header {background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-radius:24px; padding:1.5rem 2rem; margin-bottom:2rem; display:flex; justify-content:space-between; align-items:center; box-shadow:0 20px 40px rgba(0,20,60,0.08); border:1px solid rgba(255,255,255,0.5);}
    .header h1 {color:#1e2f4f; font-size:2rem;}
    .logout-btn {background:#fee2e2; color:#dc2626; padding:0.6rem 1.5rem; border-radius:40px; text-decoration:none; font-weight:500; border:1px solid #fecaca; transition:0.3s;}
    .logout-btn:hover {background:#dc2626; color:white;}
    .card {background:white; border-radius:24px; padding:2rem; border:1px solid rgba(230,240,255,0.8); margin-bottom:2rem; box-shadow:0 15px 30px rgba(0,20,40,0.06);}
    .card h2 {color:#1e2f4f; margin-bottom:1rem;}
    .stat {display:flex; justify-content:space-between; margin-bottom:0.5rem;}
    .stat span {font-weight:600;}
    .withdrawal-form {margin-top:1rem;}
    .withdrawal-form input, .withdrawal-form textarea {width:100%; padding:0.8rem 1rem; margin-bottom:0.8rem; border-radius:12px; border:1px solid #eef3fc; font-size:0.95rem; outline:none;}
    .withdrawal-form input:focus, .withdrawal-form textarea:focus {border-color:#1e2f4f;}
    .withdrawal-btn {width:100%; padding:1rem; background:#1e2f4f; color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:1rem;}
    .withdrawal-btn:hover {background:#2d4373;}
    .history-table {width:100%; border-collapse:collapse; margin-top:1rem;}
    .history-table th, .history-table td {padding:0.8rem; text-align:left; border-bottom:1px solid #f0f5fd;}
    .history-table th {color:#5f7d9c; font-weight:500; font-size:0.85rem;}
    .footer {text-align:center; color:#5f7d9c; font-size:0.9rem; margin-top:2rem;}
</style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>📈 Investor Portal</h1>
        <a href="#" class="logout-btn" onclick="logout()">Logout</a>
    </div>

    <!-- Welcome Card -->
    <div class="card" id="welcomeCard">
        <h2>Welcome, <span id="investorName"></span>!</h2>
        <div class="stat"><span>Current Balance:</span> <span id="currentBalance">R0</span></div>
        <div class="stat"><span>Profit:</span> <span id="profitAmount">R0</span></div>
        <div class="stat"><span>Initial Investment:</span> <span id="initialInvestment">R0</span></div>
    </div>

    <!-- Withdrawal Request -->
    <div class="card">
        <h2>Request Withdrawal</h2>
        <form class="withdrawal-form" onsubmit="requestWithdrawal(event)">
            <input type="number" id="withdrawAmount" placeholder="Amount to withdraw" required>
            <textarea id="withdrawReason" rows="3" placeholder="Reason for withdrawal (e.g., Education, Business)"></textarea>
            <button type="submit" class="withdrawal-btn">Submit Request →</button>
        </form>
    </div>

    <!-- Withdrawal History -->
    <div class="card">
        <h2>Withdrawal History</h2>
        <table class="history-table" id="withdrawalHistory">
            <thead><tr><th>Date</th><th>Amount</th><th>Reason</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer">PrimeWave Capital © 2025 | 📍 Durban, South Africa | 📞 +27 62 550 3303</div>
</div>

<script>
let investors = [
    { id:'INV001', name:'Thabo M.', initial:125000, current:142800, withdrawals:[] },
    { id:'INV002', name:'Nomsa K.', initial:250000, current:289500, withdrawals:[] },
    { id:'INV003', name:'David R.', initial:50000, current:61200, withdrawals:[] }
];

let pendingWithdrawals = [];

function loadInvestorData(){
    const investorId = localStorage.getItem('currentInvestor');
    if(!investorId){ alert('No investor logged in'); window.location.href='index.html'; return; }
    const investor = investors.find(i=>i.id===investorId);
    if(!investor){ alert('Investor not found'); window.location.href='index.html'; return; }
    document.getElementById('investorName').innerText = investor.name;
    document.getElementById('currentBalance').innerText = 'R'+investor.current.toLocaleString();
    document.getElementById('profitAmount').innerText = (investor.current-investor.initial)>=0?'+R'+(investor.current-investor.initial).toLocaleString():'-R'+Math.abs(investor.current-investor.initial).toLocaleString();
    document.getElementById('initialInvestment').innerText = 'R'+investor.initial.toLocaleString();
    loadWithdrawalHistory();
}

function loadWithdrawalHistory(){
    const investorId = localStorage.getItem('currentInvestor');
    const investor = investors.find(i=>i.id===investorId);
    const tbody = document.querySelector('#withdrawalHistory tbody');
    tbody.innerHTML='';
    investor.withdrawals.forEach(w=>{
        tbody.innerHTML+=`<tr><td>${w.date}</td><td>R${w.amount.toLocaleString()}</td><td>${w.reason}</td><td>${w.status}</td></tr>`;
    });
}

function requestWithdrawal(e){
    e.preventDefault();
    const amount=parseFloat(document.getElementById('withdrawAmount').value);
    const reason=document.getElementById('withdrawReason').value || 'No reason';
    const investorId = localStorage.getItem('currentInvestor');
    const investor = investors.find(i=>i.id===investorId);
    if(amount>investor.current){ alert('Insufficient balance'); return; }
    const today = new Date().toISOString().split('T')[0];
    investor.withdrawals.push({date:today, amount, reason, status:'Pending'});
    pendingWithdrawals.push({id:'WD'+(pendingWithdrawals.length+1).padStart(3,'0'), investorId, name:investor.name, amount, date:today, reason});
    document.getElementById('withdrawAmount').value=''; document.getElementById('withdrawReason').value='';
    loadInvestorData();
    alert('Withdrawal request submitted!');
}

function logout(){ localStorage.removeItem('currentInvestor'); window.location.href='index.html'; }

loadInvestorData();
</script>
</body>
</html>
