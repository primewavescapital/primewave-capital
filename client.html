<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeWave Capital | Client Portal</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:linear-gradient(145deg,#f8faff 0%,#f0f5fe 100%);min-height:100vh;padding:2rem;}
.container{max-width:1000px;margin:0 auto;}
.header{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-radius:24px;padding:1.5rem 2rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 40px rgba(0,20,60,0.08);}
.header h1{color:#1e2f4f;font-size:2rem;font-weight:600;}
.logout-btn{background:#fee2e2;color:#dc2626;padding:0.6rem 1.5rem;border-radius:40px;text-decoration:none;font-weight:500;border:1px solid #fecaca;transition:all 0.3s;}
.logout-btn:hover{background:#dc2626;color:white;}
.login-card,.dashboard-card{background:white;border-radius:24px;padding:2rem;border:1px solid rgba(230,240,255,0.8);box-shadow:0 15px 30px rgba(0,20,40,0.06);margin-bottom:2rem;}
.form-group{margin-bottom:1rem;}
.form-group label{display:block;color:#5f7d9c;font-size:0.85rem;margin-bottom:0.3rem;}
.form-group input{width:100%;padding:0.8rem 1rem;border:2px solid #eef3fc;border-radius:12px;font-size:0.95rem;outline:none;}
.form-group input:focus{border-color:#1e2f4f;}
.add-btn{width:100%;padding:1rem;background:#1e2f4f;color:white;border:none;border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;margin-top:0.5rem;}
.add-btn:hover{background:#2d4373;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
.stat-card{background:white;border-radius:20px;padding:1.8rem;box-shadow:0 15px 30px rgba(0,20,40,0.06);border:1px solid rgba(230,240,255,0.8);}
.stat-label{color:#5f7d9c;font-size:0.9rem;text-transform:uppercase;margin-bottom:0.5rem;}
.stat-number{color:#1e2f4f;font-size:2rem;font-weight:700;margin-bottom:0.3rem;}
.stat-trend{color:#28a745;font-size:0.95rem;}
.withdrawal-item{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:#f8fcff;border-radius:12px;margin-bottom:0.8rem;}
.withdrawal-amount{font-weight:700;color:#1e2f4f;font-size:1.1rem;}
.footer{text-align:center;color:#5f7d9c;font-size:0.9rem;margin-top:2rem;}
</style>
</head>
<body>
<div class="container">
  
<!-- Header -->
<div class="header">
    <h1>💼 Client Portal</h1>
    <a href="#" class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Logout</a>
</div>

<!-- Login Card -->
<div class="login-card" id="loginCard">
  <h2>Login to Your Account</h2>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="loginUsername" placeholder="Enter username">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter password">
  </div>
  <button class="add-btn" onclick="login()">Login</button>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none;">

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Initial Investment</div>
      <div class="stat-number" id="statInitial">R0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current Balance</div>
      <div class="stat-number" id="statBalance">R0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Profit</div>
      <div class="stat-number" id="statProfit">R0</div>
    </div>
  </div>

  <!-- Request Withdrawal -->
  <div class="dashboard-card">
    <h3>Request Withdrawal</h3>
    <div class="form-group">
      <label>Amount</label>
      <input type="number" id="withdrawAmount" placeholder="Enter amount">
    </div>
    <div class="form-group">
      <label>Reason</label>
      <input type="text" id="withdrawReason" placeholder="Reason for withdrawal">
    </div>
    <button class="add-btn" onclick="requestWithdrawal()">Submit Request</button>
  </div>

  <!-- Withdrawal History -->
  <div class="dashboard-card">
    <h3>Withdrawal History</h3>
    <div id="withdrawHistory"></div>
  </div>
</div>

<div class="footer">PrimeWave Capital © 2025 | 📍 Durban, South Africa | 📞 +27 62 550 3303</div>
</div>

<script>
// --- LocalStorage reference ---
let investors = JSON.parse(localStorage.getItem('investors')) || [];
let pendingWithdrawals = JSON.parse(localStorage.getItem('pendingWithdrawals')) || [];
let currentUser = JSON.parse(localStorage.getItem('currentClient')) || null;

// --- Login ---
function login(){
  let username = document.getElementById('loginUsername').value.trim();
  let password = document.getElementById('loginPassword').value.trim();
  let user = investors.find(i=>i.username===username && i.password===password);
  if(user){currentUser = user; localStorage.setItem('currentClient',JSON.stringify(currentUser)); showDashboard();}
  else{alert('Invalid credentials');}
}

// --- Logout ---
function logout(){
  localStorage.removeItem('currentClient');
  currentUser=null;
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginCard').style.display='block';
  document.getElementById('logoutBtn').style.display='none';
}

// --- Show Dashboard ---
function showDashboard(){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-block';
  loadDashboard();
}

// --- Load Dashboard Data ---
function loadDashboard(){
  if(!currentUser) return;
  document.getElementById('statInitial').innerText='R'+currentUser.initial.toLocaleString();
  document.getElementById('statBalance').innerText='R'+currentUser.current.toLocaleString();
  let profit = currentUser.current - currentUser.initial;
  document.getElementById('statProfit').innerText=(profit>=0?'+R':'-R')+Math.abs(profit).toLocaleString();
  loadHistory();
}

// --- Withdrawal Request ---
function requestWithdrawal(){
  let amount = parseFloat(document.getElementById('withdrawAmount').value);
  let reason = document.getElementById('withdrawReason').value.trim();
  if(!amount || !reason){alert('Fill all fields'); return;}
  if(amount>currentUser.current){alert('Cannot withdraw more than balance'); return;}
  let wdId = 'WD'+Date.now();
  let date = new Date().toLocaleDateString();
  pendingWithdrawals.push({id:wdId,investorId:currentUser.id,name:currentUser.name,amount,date,reason});
  currentUser.history.push({date,amount,reason,status:'Pending'});
  updateUserData();
  alert('✅ Withdrawal request submitted');
  document.getElementById('withdrawAmount').value='';
  document.getElementById('withdrawReason').value='';
  loadHistory();
}

// --- Load Withdrawal History ---
function loadHistory(){
  let historyDiv = document.getElementById('withdrawHistory');
  historyDiv.innerHTML='';
  currentUser.history.slice().reverse().forEach(h=>{
    historyDiv.innerHTML+=`<div class="withdrawal-item">
      <div><h4>${h.reason}</h4><p>${h.date}</p></div>
      <div class="withdrawal-amount">${h.status==='Approved'?`R${h.amount.toLocaleString()}`:'-'}</div>
      <div style="color:${h.status==='Approved'?'#28a745':h.status==='Declined'?'#dc3545':'#1e2f4f'};font-weight:600">${h.status}</div>
    </div>`;
  });
}

// --- Update LocalStorage ---
function updateUserData(){
  investors = investors.map(i=>i.id===currentUser.id?currentUser:i);
  localStorage.setItem('investors',JSON.stringify(investors));
  localStorage.setItem('pendingWithdrawals',JSON.stringify(pendingWithdrawals));
  localStorage.setItem('currentClient',JSON.stringify(currentUser));
  loadDashboard();
}

// --- Initialize ---
if(currentUser) showDashboard();
</script>
</body>
</html>
