<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeWave Capital | Investor Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8faff 0%, #f0f5fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 25px 25px, rgba(26, 43, 76, 0.02) 2px, transparent 0);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: white;
            border-radius: 32px;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 20, 40, 0.12);
            border: 1px solid rgba(230, 240, 255, 0.8);
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo h1 {
            color: #1e2f4f;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #5f7d9c;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #1e2f4f;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #e0ecf9;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #1e2f4f;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: #1e2f4f;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: #2d4373;
        }

        .demo-credentials {
            margin-top: 2rem;
            padding: 1.2rem;
            background: #f8fcff;
            border-radius: 16px;
            border: 1px dashed #c0d4f0;
            text-align: center;
        }

        .demo-credentials p {
            color: #5f7d9c;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .cred-box {
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 0.9rem;
        }

        .cred-item {
            text-align: left;
        }

        .cred-item strong {
            color: #1e2f4f;
            display: block;
            margin-bottom: 0.2rem;
        }

        .cred-item span {
            color: #28a745;
            font-family: monospace;
            font-size: 1rem;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #8a9bb5;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>PrimeWave Capital</h1>
            <p>Investor Portal Login</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Investor ID</label>
                <input type="text" id="investorId" placeholder="e.g., INV001" value="INV001">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" value="INV001">
            </div>
            <button type="submit" class="login-btn">Access My Portfolio →</button>
        </form>

        <div class="demo-credentials">
            <p>🔐 Demo Credentials</p>
            <div class="cred-box">
                <div class="cred-item">
                    <strong>Thabo M.</strong>
                    <span>INV001 / INV001</span>
                </div>
                <div class="cred-item">
                    <strong>Nomsa K.</strong>
                    <span>INV002 / INV002</span>
                </div>
                <div class="cred-item">
                    <strong>David R.</strong>
                    <span>INV003 / INV003</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>📍 Durban, South Africa | 📞 +27 62 550 3303</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('investorId').value;
            const pwd = document.getElementById('password').value;
            
            // Simple validation - in real app, check against database
            if(id && pwd) {
                // Store logged in user
                localStorage.setItem('currentInvestor', id);
                // Redirect to client portal
                window.location.href = 'client.html';
            } else {
                alert('Please enter both ID and password');
            }
        });
    </script>
</body>
  </html>
